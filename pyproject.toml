[project]
name = "ledger"
version = "0.1.0"
description = "Payments API with a seeded capture-retry bug, and a CLI to reproduce it."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger*", "payments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
